### A CI workflow template that runs linting and python testing
### TODO: Modify as needed or as desired.

name: Test target-api

on: [push]

jobs:
  pytest:
    # Pinned: the 26.04 image behind ubuntu-latest has no Python 3.9 build.
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    strategy:
      matrix:
        # Bounded by pyproject's `python = "<3.11,>=3.7.1"` on the high end
        # (poetry refuses 3.11) and by the ubuntu-24.04 runner image
        # on the low end (3.7/3.8 are EOL and no longer available).
        python-version: ["3.9", "3.10"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        pip install poetry
    - name: Install dependencies
      run: |
        poetry install
    - name: Test with pytest
      run: |
        poetry run pytest
