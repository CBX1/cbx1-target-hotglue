version: 1
send_anonymous_usage_stats: true
project_id: "target-api"
default_environment: test
environments:
- name: test
plugins:
  extractors: []
  loaders:
  - name: "target-api"
    namespace: "target_api"
    pip_url: -e .
    capabilities:
    - about
    - stream-maps
    - record-flattening
    settings:
    # Config truth lives in AGENTS.md + config.json; keep this list in sync.
    - name: Code
      kind: password
    - name: OrgId
    - name: process_as_batch
      kind: boolean
      value: true
    - name: batch_size
      kind: integer
      value: 50
    - name: max_size_in_bytes
      kind: integer
    - name: enforce_order
      kind: boolean
    - name: add_stream_key
      kind: boolean
      value: false
    - name: metadata
    - name: inject_batch_ids
      kind: boolean
      value: false
    - name: post_empty_record
      kind: boolean
      value: false
